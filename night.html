<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Спокойной ночи</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b1026;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: white;
            font-size: 60px;
            text-shadow: 0 0 10px #fff,
                         0 0 20px #8aa7ff,
                         0 0 40px #526dff;
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from {
                opacity: 0.7;
                transform: scale(1);
            }

            to {
                opacity: 1;
                transform: scale(1.05);
            }
        }
    </style>
</head>

<body>

    <h1>Спокойной ночи</h1>

</body>
</html>
